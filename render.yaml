# Blueprint do Render: https://render.com/docs/blueprint-spec
# Só o site. Usuários e sessões ficam num Postgres EXTERNO grátis (Neon): o banco grátis do Render
# expira em 30 dias e é apagado. Veja o passo a passo no README.
services:
  - type: web
    name: odd
    runtime: docker
    plan: free
    branch: claude/betano-odds-mirror-football-ijkq09
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL # URL de conexão do Neon: cole em Environment no painel do Render (contém senha: nunca no GitHub)
        sync: false
      - key: BACKUP_DATABASE_URL # URL de um SEGUNDO banco (outro projeto do Neon): recebe a cópia do histórico a cada alteração
        sync: false
      - key: ADMIN_USER # primeiro administrador (só é criado se o banco ainda não tiver nenhum)
        value: admin
      - key: ADMIN_PASSWORD # gerada aleatoriamente pelo Render; veja em Environment no painel do serviço
        generateValue: true
