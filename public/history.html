<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Histórico · MCZ Bet</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body class="histpage">
<header>
  <div class="top">
    <h1 class="brand"><img src="/logo.svg" alt="" width="36" height="36"><span>MCZ <b>Bet</b></span></h1>
    <div id="account">
      <button id="themeToggle" type="button" aria-label="Mudar o tema">
        <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <span id="who"></span>
      <a id="adminLink" href="/admin.html" hidden>Usuários</a>
      <button id="logout" type="button">Sair</button>
    </div>
  </div>
  <nav class="tabs" aria-label="Seções">
    <a href="/">Odds</a>
    <a href="/history.html" aria-current="page">Histórico</a>
  </nav>
</header>
<main class="histmain">
  <div class="histtools">
    <h2 id="histTitle">Histórico das apostas</h2>
    <label id="userFilterBox" hidden>Usuário
      <select id="userFilter"><option value="">Todos</option></select>
    </label>
  </div>
  <p class="hint" id="histHint">Cada aposta mostra a data e a hora de tudo o que foi feito nela. Os horários são os do servidor (Brasília).</p>
  <section id="backupBox" class="backupbox" hidden>
    <p id="backupStatus" role="status"></p>
    <p class="backuplinks">Baixar tudo: <a href="/api/admin/history/export?format=csv" download>Planilha (CSV)</a> · <a href="/api/admin/history/export?format=json" download>JSON</a></p>
  </section>
  <p id="histMsg" role="status" hidden></p>
  <div id="slips"></div>
  <section id="adminSection" hidden>
    <h2>Administração de usuários</h2>
    <ul id="adminEvents" class="timeline"></ul>
  </section>
  <button id="more" type="button" class="loadmore" hidden>Carregar mais</button>
</main>
<script type="module" src="/history.js"></script>
</body>
</html>
