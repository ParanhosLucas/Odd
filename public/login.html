<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar · MCZ Bet</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body class="auth">
<button id="themeToggle" class="theme-corner" type="button" aria-label="Mudar o tema">
  <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
<main class="card">
  <div class="logo"><img src="/logo.svg" alt="" width="76" height="76"></div>
  <h1 class="brand brand-lg"><span>MCZ <b>Bet</b></span></h1>
  <p class="sub">Entre com o seu usuário e senha.</p>
  <form id="form">
    <label>Usuário
      <input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    </label>
    <label>Senha
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <p id="error" class="error" role="alert" hidden></p>
    <button type="submit" class="primary">Entrar</button>
  </form>
  <p class="hint">Não tem acesso? Peça a um administrador para criar o seu usuário.</p>
</main>
<script type="module" src="/login.js"></script>
</body>
</html>
