<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCZ Bet</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="top">
    <h1 class="brand"><img src="/logo.svg" alt="" width="36" height="36"><span>MCZ <b>Bet</b></span></h1>
    <div id="account">
      <button id="themeToggle" type="button" aria-label="Mudar o tema">
        <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <span id="who"></span>
      <a id="adminLink" href="/admin.html" hidden>Usuários</a>
      <button id="logout" type="button">Sair</button>
    </div>
  </div>
  <nav class="tabs" aria-label="Seções">
    <a href="/" aria-current="page">Odds</a>
    <a href="/history.html">Histórico</a>
  </nav>
  <input id="q" type="search" placeholder="Buscar time ou campeonato…">
  <span id="status"></span>
  <div id="days">
    <button id="prev" aria-label="Dia anterior">‹</button>
    <span id="dayLabel"></span>
    <button id="next" aria-label="Próximo dia">›</button>
  </div>
</header>
<div id="banner" hidden></div>
<div class="layout">
  <aside id="side">
    <details id="pinnedBox" open>
      <summary><svg class="pinicon" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.8 1.2 14.8 6.2 13.4 7.6l-1-.4-2.3 2.3.2 2.6-1.1 1.1-2.6-2.6-3.9 3.9-.7-.7 3.9-3.9L2.3 7.3l1.1-1.1 2.6.2 2.3-2.3-.4-1z"/></svg><span>LIGAS FIXADAS</span></summary>
      <ul id="pinned"></ul>
    </details>
  </aside>
  <div class="content">
    <div id="leagueNote" hidden></div>
    <main id="list"></main>
  </div>
</div>
<div id="bar" hidden>
  <div id="barInfo">
    <span id="count"></span>
    <span id="minHint" role="status" hidden></span>
    <span id="total" hidden></span>
    <span id="reg" hidden></span>
  </div>
  <div id="barStake">
    <label id="stakeBox">Valor da aposta <span>R$</span><input id="stake" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" maxlength="14" aria-label="Valor da aposta em reais"></label>
    <button id="clear" type="button">Limpar</button>
  </div>
  <div id="barActions">
    <button id="copy" type="button">Copiar mensagem</button>
    <button id="send" type="button">Enviar no WhatsApp</button>
  </div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
