<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odds Futebol</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>⚽ Odds · Futebol</h1>
  <input id="q" type="search" placeholder="Buscar time ou campeonato…">
  <span id="status"></span>
  <nav id="filters">
    <button data-f="all" class="on">Todos</button>
    <button data-f="live">Ao vivo</button>
    <button data-f="next">Próximos</button>
  </nav>
  <div id="days">
    <button id="prev" aria-label="Dia anterior">‹</button>
    <span id="dayLabel"></span>
    <button id="next" aria-label="Próximo dia">›</button>
  </div>
</header>
<div id="banner" hidden></div>
<div class="layout">
  <aside id="side">
    <details id="pinnedBox" open>
      <summary><svg class="pinicon" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.8 1.2 14.8 6.2 13.4 7.6l-1-.4-2.3 2.3.2 2.6-1.1 1.1-2.6-2.6-3.9 3.9-.7-.7 3.9-3.9L2.3 7.3l1.1-1.1 2.6.2 2.3-2.3-.4-1z"/></svg><span>LIGAS FIXADAS</span></summary>
      <ul id="pinned"></ul>
    </details>
  </aside>
  <div class="content">
    <div id="leagueNote" hidden></div>
    <main id="list"></main>
  </div>
</div>
<div id="bar" hidden>
  <span id="count"></span>
  <button id="clear" type="button">Limpar</button>
  <button id="copy" type="button">Copiar mensagem</button>
  <button id="send" type="button">Enviar no WhatsApp</button>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
