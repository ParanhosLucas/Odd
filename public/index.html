<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odds Futebol</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>⚽ Odds · Futebol</h1>
  <input id="q" type="search" placeholder="Buscar time ou campeonato…">
  <span id="status"></span>
  <nav id="filters">
    <button data-f="all" class="on">Todos</button>
    <button data-f="live">Ao vivo</button>
    <button data-f="next">Próximos</button>
  </nav>
  <div id="days">
    <button id="prev" aria-label="Dia anterior">‹</button>
    <span id="dayLabel"></span>
    <button id="next" aria-label="Próximo dia">›</button>
  </div>
</header>
<div id="banner" hidden></div>
<main id="list"></main>
<script src="/app.js"></script>
</body>
</html>
